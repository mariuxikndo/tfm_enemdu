# ══════════════════════════════════════════════════════════════════
#  config/indicators.yaml — Catálogo de indicadores ambientales
#  Plataforma MIAH-ENEMDU 2025 · Alineado con MDEA (ONU/CEPAL, 2013)
#
#  Estructura de cada indicador:
#    id           : código único del indicador
#    nombre       : etiqueta corta para la interfaz
#    descripcion  : descripción completa para fichas técnicas
#    dimension    : agua | residuos | energia | movilidad | conciencia
#    archivo      : ambiental_ago | ambiental_oct | persona_ago
#    tipo         : proporcion | media | indice
#    variable     : variable(s) del Parquet que intervienen
#    valor_pos    : valor(es) que representan la práctica positiva
#    excluir_vals : valores que excluyen el registro del denominador
#    unidad       : unidad de medida del resultado
#    formula      : descripción de la fórmula en texto
#    desagregable : [area, prov] — dimensiones de desagregación disponibles
#    ods          : Objetivo de Desarrollo Sostenible relacionado
# ══════════════════════════════════════════════════════════════════

dimensiones:
  agua: "Prácticas de uso del agua"
  residuos: "Gestión y clasificación de residuos"
  energia: "Eficiencia energética"
  movilidad: "Movilidad y transporte"
  conciencia: "Conciencia y responsabilidad ambiental"

indicadores:
  # ── DIMENSIÓN: AGUA ──────────────────────────────────────────────
  # Formulario OCT-2025, Sección 6, Pregunta 5
  # Escala: 1=Sí, 2=No, 3=No aplica

  - id: IND_AGUA_01
    nombre: "Hogares que reusan el agua"
    descripcion: "Porcentaje de hogares que habitualmente reusan el agua para regar, fregar o tirar al baño"
    dimension: agua
    archivo: ambiental_oct
    tipo: proporcion
    variable: s101p61
    valor_pos: [1]
    excluir_vals: [3]
    unidad: "%"
    formula: "sum(fexp donde s101p61=1) / sum(fexp donde s101p61 en [1,2]) × 100"
    desagregable: [area, prov]
    ods: "ODS 6 — Agua limpia y saneamiento"

  - id: IND_AGUA_02
    nombre: "Uso de balde en lugar de manguera"
    descripcion: "Porcentaje de hogares que habitualmente usan balde en lugar de manguera para lavar vehículo, regar plantas, etc."
