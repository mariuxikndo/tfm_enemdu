  # ── DIMENSIÓN: MOVILIDAD ─────────────────────────────────────────
  # Formulario AGO-2025, Sección 5, Pregunta 2
  # Para personas de 12 años y más con destino habitual

  - id: IND_MOV_01
    nombre: "Uso de transporte público colectivo"
    descripcion: "Porcentaje de personas (≥12 años con destino habitual) cuyo medio principal de traslado es el transporte público colectivo (autobús, metrovía/tranvía/trolebús o metro)"
    dimension: movilidad
    archivo: persona_ago
    tipo: proporcion
    variable: usa_transporte_publico
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde s5p2 en [1,4,5]) / sum(fexp donde s5p2 no es NaN) × 100"
    desagregable: [area, prov]
    ods: "ODS 11 — Ciudades y comunidades sostenibles"
    nota: "Códigos transporte público colectivo: 1=Autobús, 4=Metrovía/Tranvía/Trolebús, 5=Metro"

  - id: IND_MOV_02
    nombre: "Movilidad sostenible"
    descripcion: "Porcentaje de personas cuyo medio principal es transporte público colectivo, bicicleta o desplazamiento a pie"
    dimension: movilidad
    archivo: persona_ago
    tipo: proporcion
    variable: usa_movilidad_sostenible
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde s5p2 en [1,4,5,8,9]) / sum(fexp donde s5p2 no es NaN) × 100"
    desagregable: [area, prov]
    ods: "ODS 11 — Ciudades y comunidades sostenibles"

  - id: IND_MOV_03
    nombre: "Tiempo promedio de traslado"
    descripcion: "Tiempo promedio ponderado de traslado desde el hogar al destino habitual, expresado en minutos"
    dimension: movilidad
    archivo: persona_ago
    tipo: media
    variable: tiempo_traslado_min
    valor_pos: null
    excluir_vals: []
    unidad: "minutos"
    formula: "sum(fexp × tiempo_traslado_min) / sum(fexp) — solo registros con tiempo válido"
    desagregable: [area, prov]
    ods: "ODS 11 — Ciudades y comunidades sostenibles"

  # ── DIMENSIÓN: CONCIENCIA AMBIENTAL ──────────────────────────────
  # Formulario OCT-2025, Sección 6, Preguntas 9–13

  - id: IND_CA_01
    nombre: "Hogares que perciben problemas ambientales en su barrio"
    descripcion: "Porcentaje de hogares que identifican al menos uno de los seis problemas ambientales en su barrio (contaminación visual, agua, ruidos, basura, aire, animales)"
    dimension: conciencia
    archivo: ambiental_oct
    tipo: proporcion
    variable: percibe_problema_ambiental
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde percibe_problema_ambiental=1) / sum(fexp) × 100"
    desagregable: [area, prov]
    ods: "ODS 13 — Acción por el clima"

  - id: IND_CA_02
    nombre: "Preocupación alta por el ambiente"
    descripcion: "Porcentaje de hogares cuyo jefe/cónyuge declara preocuparse MUCHO o EXCESIVAMENTE por la situación del ambiente en su barrio (s91p10=4 o 5)"
    dimension: conciencia
    archivo: ambiental_oct
    tipo: proporcion
    variable: preocupacion_alta
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde s91p10 en [4,5]) / sum(fexp donde s91p10 no es NaN) × 100"
    desagregable: [area, prov]
    ods: "ODS 13 — Acción por el clima"
    nota: "Escala: 1=Nada, 2=Poco, 3=Medianamente, 4=Mucho, 5=Excesivamente"

  - id: IND_CA_03
    nombre: "Participación en actividades ambientales"
    descripcion: "Porcentaje de hogares en los que al menos un miembro participó en actividades ambientales durante los últimos 12 meses (voluntariado, denuncia, manifestación, educación ambiental)"
    dimension: conciencia
    archivo: ambiental_oct
    tipo: proporcion
    variable: participo_actividad_ambiental
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde participo_actividad_ambiental=1) / sum(fexp) × 100"
    desagregable: [area, prov]
    ods: "ODS 13 — Acción por el clima"

  - id: IND_CA_04
    nombre: "Uso de bolsa reutilizable en compras"
    descripcion: "Porcentaje de hogares que habitualmente utilizan bolsa o contenedor de tela o material reutilizable al hacer sus compras"
    dimension: conciencia
    archivo: ambiental_ago
    tipo: proporcion
    variable: s91p7
    valor_pos: [1]
    excluir_vals: []
    unidad: "%"
    formula: "sum(fexp donde s91p7=1) / sum(fexp donde s91p7 no es NaN) × 100"
    desagregable: [area, prov]
    ods: "ODS 12 — Producción y consumo responsables"
    nota: "Códigos: 1=Tela/reutilizable, 2=Papel/cartón, 3=Plástico desechable"

  - id: IND_CA_05
    nombre: "Índice de conciencia ambiental (ICA)"
    descripcion: "Índice compuesto que integra preocupación ambiental, percepción de problemas y participación en actividades ambientales. Media ponderada del índice (0=ninguna dimensión, 3=todas)"
    dimension: conciencia
    archivo: ambiental_oct
    tipo: indice
    variable: idx_conciencia
    valor_pos: null
    excluir_vals: []
    unidad: "puntos (0–3)"
    formula: "media ponderada(idx_conciencia) con fexp"
    desagregable: [area, prov]
    ods: "ODS 13 — Acción por el clima"
